<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>Keyword Updater Tool - CBA Utils</title>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="container">
            <h1>
                Keyword Updater
            </h1>

            <form>
                <fieldset>
                    <legend>Upload File</legend>
                    <div class="file-upload-container">
                        <input 
                            type="text"
                            id="uploadedFilePath"
                            value="Please select a folder..."
                            readonly
                            name="uploadedFilePath"
                            class="file-upload-path"
                        />
                        <input 
                            type="button"
                            id="fileUpload"
                            value="Choose Folder"
                            class="file-upload-button"
                        />
                    </div>
                </fieldset>

                <input 
                    type="button"
                    value="Start Process"
                    id="submitBtn"
                />
            </form>

            <div id="status"></div>

        </div>

        <script src="./renderer.js"></script>
    </body>
</html>
